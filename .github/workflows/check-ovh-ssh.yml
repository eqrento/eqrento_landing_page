# Connection check to the OVH server – CHANGES NOTHING there. Run by hand (Actions → "Check connection to OVH (SSH)"
# → Run workflow) or by Claude:  gh workflow run check-ovh-ssh.yml
# Shows, step by step: is the private key usable, is the SSH port reachable from GitHub, the server's host keys
# (the value for the OVH_KNOWN_HOSTS secret), does the key log in, does the site folder exist and is it writable,
# is rsync installed, what is in the folder now. Uses the same secrets as deploy-ovh.yml (OVH_KNOWN_HOSTS not needed).
name: Check connection to OVH (SSH)

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: 'Optional: a PEM public key, base64 in one line. The demo form settings are then read and shown ONLY ENCRYPTED with it (this repository and its logs are public).'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OVH_HOST: ${{ secrets.OVH_HOST }}
      OVH_PORT: ${{ secrets.OVH_PORT || '22' }}
      OVH_USER: ${{ secrets.OVH_USER }}
      OVH_PATH: ${{ secrets.OVH_PATH }}
    steps:
      - name: Private key
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OVH_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ssh-keygen -y -P "" -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "Key OK, no passphrase: $(ssh-keygen -lf ~/.ssh/deploy_key.pub)"
          else
            echo "::error::OVH_SSH_KEY is not a usable private key – paste the whole file (with the BEGIN/END lines); it must have no passphrase"
            exit 1
          fi

      - name: SSH port reachable from GitHub
        run: |
          if timeout 15 bash -c "exec 3<>/dev/tcp/$OVH_HOST/$OVH_PORT" 2>/dev/null; then
            echo "Port $OVH_PORT is reachable from GitHub."
          else
            echo "::error::Port $OVH_PORT is NOT reachable from GitHub – it is closed or filtered, or SSH runs on another port (then set the OVH_PORT secret)"
            exit 1
          fi

      - name: Server host keys (value for OVH_KNOWN_HOSTS)
        run: |
          ssh-keyscan -T 15 -p "$OVH_PORT" "$OVH_HOST" 2>/dev/null > ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then echo "::error::The server sent no SSH host keys"; exit 1; fi
          echo "----- host key lines (the address is shown as *** because it is a secret) -----"
          cat ~/.ssh/known_hosts
          echo "----- fingerprints -----"
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Log in and check the site folder
        run: |
          ssh -p "$OVH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$OVH_USER@$OVH_HOST" \
              "echo LOGIN_OK as \$(whoami); test -d '$OVH_PATH' && echo FOLDER_EXISTS || echo FOLDER_MISSING; test -w '$OVH_PATH' && echo FOLDER_WRITABLE || echo FOLDER_NOT_WRITABLE; command -v rsync >/dev/null && echo RSYNC_INSTALLED || echo RSYNC_MISSING; echo UMASK \$(umask); echo NOT_OWNED_BY_ME \$(find '$OVH_PATH' ! -user \"\$(whoami)\" | wc -l); echo NOT_WRITABLE_DIRS \$(find '$OVH_PATH' -type d ! -writable | wc -l); echo NOT_WRITABLE_FILES \$(find '$OVH_PATH' -type f ! -writable | wc -l); echo '--- owners and modes (count  owner:group  mode  type) ---'; find '$OVH_PATH' -printf '%u:%g %m %y\n' | sort | uniq -c; echo '--- folder contents (top level) ---'; ls -A '$OVH_PATH' | head -60"

      # Read-only, and it prints only yes/no facts and file names (this repository is public, so are its logs): can this
      # user change the web server's settings (sudo without a password), where is the eqrento.com server block, may this
      # user write it, and does it already hold the old-language rule and the 404 page.
      - name: Web server settings (read-only)
        run: |
          ssh -p "$OVH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$OVH_USER@$OVH_HOST" '
            if sudo -n true 2>/dev/null; then echo "SUDO_WITHOUT_PASSWORD yes"; else echo "SUDO_WITHOUT_PASSWORD no"; fi
            command -v nginx >/dev/null && echo "NGINX $(nginx -v 2>&1 | cut -d/ -f2)" || echo "NGINX not on PATH"
            files=$(grep -rlE "server_name[^;]*[[:space:]]eqrento\.com" /etc/nginx/ 2>/dev/null)
            [ -n "$files" ] || echo "SERVER_BLOCK not found (or not readable)"
            for f in $files; do
              echo "SERVER_BLOCK $f"
              [ -w "$f" ] && echo "  WRITABLE_BY_ME yes" || echo "  WRITABLE_BY_ME no"
              grep -qE "\(en\|pl\|de" "$f" && echo "  OLD_LANGUAGE_RULE present" || echo "  OLD_LANGUAGE_RULE absent"
              grep -qE "error_page[[:space:]]+404" "$f" && echo "  ERROR_PAGE_404 present" || echo "  ERROR_PAGE_404 absent"
            done'

      # Read-only as well, yes/no facts only: what could run a small form-to-e-mail program on this server, how the web
      # server runs, and whether the server may reach a mail server (asked for the demo / audit forms, 10 Nov 2026).
      - name: What the server can run and send (read-only)
        run: |
          ssh -p "$OVH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$OVH_USER@$OVH_HOST" '
            for t in python3 go node php; do command -v $t >/dev/null 2>&1 && echo "RUNTIME $t yes" || echo "RUNTIME $t no"; done
            [ "$(ps -eo comm= | grep -c "^php-fpm")" -gt 0 ] && echo "PHP_FPM_RUNNING yes" || echo "PHP_FPM_RUNNING no"
            p=$(pgrep -x nginx | head -1)
            [ -n "$p" ] && echo "NGINX_PROCESS yes" || echo "NGINX_PROCESS no"
            if [ -n "$p" ] && grep -qE "docker|containerd|kubepods" /proc/$p/cgroup 2>/dev/null; then echo "NGINX_IN_CONTAINER yes"; else echo "NGINX_IN_CONTAINER no (or not visible)"; fi
            docker ps >/dev/null 2>&1 && echo "DOCKER_ACCESS yes" || echo "DOCKER_ACCESS no"
            command -v sendmail >/dev/null 2>&1 && echo "SENDMAIL yes" || echo "SENDMAIL no"
            for hp in smtp.gmail.com:587 smtp-relay.gmail.com:587 smtp.gmail.com:465; do
              h=${hp%:*}; q=${hp#*:}
              timeout 6 bash -c "exec 3<>/dev/tcp/$h/$q" 2>/dev/null && echo "SMTP_OUT $hp reachable" || echo "SMTP_OUT $hp blocked"
            done
            echo "LINGER $(loginctl show-user "$(whoami)" -p Linger 2>/dev/null | cut -d= -f2)"
            systemctl --user show-environment >/dev/null 2>&1 && echo "SYSTEMD_USER_SESSION yes" || echo "SYSTEMD_USER_SESSION no"
            crontab -l >/dev/null 2>&1; echo "CRONTAB exit $? (0 has entries, 1 allowed but empty)"'

      # The demo form's e-mail settings (17 Nov 2026: a test request was accepted, but no e-mail arrived). Read-only, and
      # only when a public key is given. The log is public, so only yes/no facts are printed in plain text; the addresses,
      # the other settings and the service's own log lines (one per request, no personal data) are printed ENCRYPTED with
      # that key (AES-256 for the text, RSA-OAEP for the AES key) – only the holder of the private key can read them.
      # SMTP_PASSWORD is never read: the check only says whether it is set.
      - name: Demo form settings (read-only, shown encrypted)
        if: ${{ inputs.pubkey != '' }}
        env:
          PUBKEY_B64: ${{ inputs.pubkey }}
        run: |
          out=$(ssh -p "$OVH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=15 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              "$OVH_USER@$OVH_HOST" '
            keys="MAIL_TO|MAIL_FROM|MAIL_FROM_NAME|SMTP_HOST|SMTP_PORT|SMTP_SECURITY|SMTP_USER|SMTP_HELO|MIN_SECONDS"
            pids=$(pgrep -f "python.*[f]ormmail\.py" | tr "\n" " ")
            [ -n "$pids" ] && echo "FACT FORMMAIL_PROCESS yes" || echo "FACT FORMMAIL_PROCESS no (or not visible)"
            for p in $pids; do
              [ "$(stat -c %u /proc/$p 2>/dev/null)" = "$(id -u)" ] && echo "FACT PROCESS_RUNS_AS_ME yes" || echo "FACT PROCESS_RUNS_AS_ME no"
              grep -qE "docker|containerd" /proc/$p/cgroup 2>/dev/null && echo "FACT PROCESS_IN_CONTAINER yes" || echo "FACT PROCESS_IN_CONTAINER no"
              if [ -r /proc/$p/environ ]; then
                echo "FACT PROCESS_SETTINGS_READABLE yes"
                tr "\0" "\n" < /proc/$p/environ | grep -E "^($keys)=" | sed "s/^/SECRET process /"
                tr "\0" "\n" < /proc/$p/environ | grep -qE "^SMTP_PASSWORD=.+" && echo "SECRET process SMTP_PASSWORD is set" || echo "SECRET process SMTP_PASSWORD is empty"
              else
                echo "FACT PROCESS_SETTINGS_READABLE no"
              fi
            done
            files=$(timeout 25 find /opt /srv /home /var/www /var/lib/docker/volumes /etc /usr/local /root -maxdepth 6 -name formmail.env 2>/dev/null)
            [ -n "$files" ] && echo "FACT SETTINGS_FILE_FOUND yes" || echo "FACT SETTINGS_FILE_FOUND no (or not visible to this user)"
            for f in $files; do
              if [ -r "$f" ]; then
                echo "FACT SETTINGS_FILE_READABLE yes"
                echo "SECRET file $f"
                grep -E "^[[:space:]]*(export[[:space:]]+)?($keys)=" "$f" | sed "s/^/SECRET file /"
                grep -qE "^[[:space:]]*(export[[:space:]]+)?SMTP_PASSWORD=.+" "$f" && echo "SECRET file SMTP_PASSWORD is set" || echo "SECRET file SMTP_PASSWORD is empty"
              else
                echo "FACT SETTINGS_FILE_READABLE no"
              fi
            done
            lines=$(journalctl --no-pager -o cat --since "2026-11-16" 2>/dev/null | grep -E " formmail (sent|dropped|mail-error|invalid|rate-limited|too-large)" | tail -n 40)
            [ -n "$lines" ] && echo "FACT SERVICE_LOG_READABLE yes" || echo "FACT SERVICE_LOG_READABLE no (or empty)"
            printf "%s\n" "$lines" | sed "/^\$/d; s/^/SECRET log /"
            true') || true
          printf '%s\n' "$out" | sed -n 's/^FACT //p'
          secret=$(printf '%s\n' "$out" | sed -n 's/^SECRET //p')
          if [ -z "$secret" ]; then echo "Nothing to encrypt: no setting and no log line was readable for this user."; exit 0; fi
          printf '%s' "$PUBKEY_B64" | base64 -d > pub.pem
          K=$(openssl rand -hex 32)
          echo "ENCRYPTED_KEY $(printf '%s' "$K" | openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)"
          echo "ENCRYPTED_DATA $(printf '%s' "$secret" | K="$K" openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:K -base64 -A)"
          rm -f pub.pem

      - name: Remove the key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_key.pub
