<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EQrento Pricing</title>
  <!-- The old site's pricing address (/en/pricing, /pl/pricing, /de/pricing – the same file in en/, pl/ and de/) sends
       visitors and search engines straight to the pricing page. An instant meta refresh, which Google treats as a
       permanent redirect; a 301 on the server (nginx) does the same job even better. The link is relative, so it also
       works on the GitHub preview (…/eqrento_landing_page/pricing). No script: the server's CSP allows no inline JS. -->
  <meta http-equiv="refresh" content="0; url=../pricing">
  <link rel="canonical" href="https://eqrento.com/pricing">
</head>
<body>
  <p>Our pricing has moved: <a href="../pricing">EQrento Pricing</a>.</p>
</body>
</html>
